name: ORVWB v6 Continuous Shadow-Live Trader

on:
  schedule:
    # 4 Staggered Morning Wake-Up Crons to beat GitHub Actions queue drops (UTC = IST - 5h30m)
    - cron: '25 3 * * 1-5'   # 08:55 IST (Early Bird Wake-Up)
    - cron: '40 3 * * 1-5'   # 09:10 IST (Primary Pre-Market Wake-Up)
    - cron: '50 3 * * 1-5'   # 09:20 IST (Backup Wake-Up 1)
    - cron: '2 4 * * 1-5'    # 09:32 IST (Backup Wake-Up 2)
  workflow_dispatch:

# Prevents duplicate runs (#100 vs #101 collision): once 1 run starts, later crons are skipped
concurrency:
  group: orvwb-shadow-live-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shadow-live-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 390

    steps:
      - name: Exit immediately if a run already completed today
        run: |
          echo "Starting ORVWB v6 Continuous Session..."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyotp smartapi-python websocket-client logzero

      - name: Run Continuous Intraday Shadow-Live Loop
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python orvwb_bot.py --live-loop

      - name: Commit and Push Final EOD Elite Ledger
        if: always()
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"
          git add ORVWB_v6_Elite_Ledger.csv
          git diff --staged --quiet || (git commit -m "Auto-update ORVWB v6 shadow-live ledger" && git pull --rebase origin main && git push)
