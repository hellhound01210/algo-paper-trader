name: ORVWB Master v6 Daily Paper Trader

on:
  schedule:
    # Morning live entry checks at 09:45, 10:15, 10:45, and 11:15 IST (04:15, 04:45, 05:15, 05:45 UTC)
    - cron: '15,45 4,5 * * 1-5'
    # Final End-of-Day Square-Off & Ledger Update at 15:35 IST (10:05 UTC)
    - cron: '5 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-paper-trader:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy smartapi-python pyotp websocket-client logzero

      - name: Run ORVWB Master v6 Bot
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python orvwb_bot.py

      - name: Commit and Push Updated Ledger
        run: |
          git config --global user.name "ORVWB Auto-Bot"
          git config --global user.email "actions@github.com"
          git add ORVWB_v6_Elite_Ledger.csv
          git diff --staged --quiet || git commit -m "Auto-update ORVWB v6 paper trading ledger"
          git push
