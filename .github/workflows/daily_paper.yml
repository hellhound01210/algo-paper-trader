name: ORVWB v6 Continuous Shadow-Live Trader

on:
  workflow_dispatch:

# Prevents duplicate overlapping runs: if a run is active, any duplicate is blocked.
concurrency:
  group: orvwb-shadow-live-trader
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shadow-live-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Continuous Intraday Shadow-Live Loop
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python orvwb_bot.py --live-loop

      - name: Commit and Push Final EOD Elite Ledger
        if: always()
        run: |
          if [ -f ORVWB_v6_Elite_Ledger.csv ]; then
            git config --global user.name "actions-user"
            git config --global user.email "actions@github.com"
            git add ORVWB_v6_Elite_Ledger.csv
            git diff --staged --quiet || (git commit -m "Auto-update ORVWB v6 shadow-live ledger" && git pull --rebase --autostash origin main && git push)
          fi
