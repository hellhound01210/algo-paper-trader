name: ORVWB v6 Daily EOD Paper Trader

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-eod-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install smartapi-python pyotp pandas numpy requests logzero websocket-client pycryptodome

      - name: Run ORVWB v6 EOD Single-Pass Bot
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python orvwb_bot.py

      - name: Commit Updated Ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ORVWB_v6_Elite_Ledger.csv
          git diff --staged --quiet || git commit -m "EOD ORVWB v6 ledger update"
          git push
