name: ORVWB v6 Daily Paper Trader

on:
  schedule:
    # Monday-Friday (1-5) IST Market Checkpoints (UTC = IST - 5h30m)
    - cron: '10 4 * * 1-5'   # 09:40 IST (Opening Range Breakout Check)
    - cron: '25 4 * * 1-5'   # 09:55 IST (Prime Morning Momentum Check)
    - cron: '45 4 * * 1-5'   # 10:15 IST (Prime Window Cutoff Check)
    - cron: '15 5 * * 1-5'   # 10:45 IST (Mid-Morning Expansion Check)
    - cron: '50 5 * * 1-5'   # 11:20 IST (Final Entry Window Cutoff Check)
    - cron: '30 7 * * 1-5'   # 13:00 IST (Midday Trail & TP Check)
    - cron: '5 10 * * 1-5'   # 15:35 IST (Final 15:15 EOD Square-Off & Ledger Commit)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyotp smartapi-python websocket-client logzero

      - name: Execute ORVWB v6 Paper Trading Bot
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python orvwb_bot.py

      - name: Commit and Push Updated Elite Ledger
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"
          git add ORVWB_v6_Elite_Ledger.csv
          git diff --staged --quiet || (git commit -m "Auto-update ORVWB v6 16-stock adaptive ledger" && git pull --rebase origin main && git push)
