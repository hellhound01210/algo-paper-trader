name: ORVWB Stock Screener (60-Day Ranker)

on:
  workflow_dispatch: # Runs only when you tap "Run workflow"

permissions:
  contents: write

jobs:
  screen-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy smartapi-python pyotp logzero websocket-client

      - name: Run 45-Stock Screener
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python orvwb_screener.py

      - name: Save Ranked Screener CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ORVWB_Screener_Ranked.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update 60-day stock screener rankings" && git push)
