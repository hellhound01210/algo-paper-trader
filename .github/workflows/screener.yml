name: ORVWB v6 99-Day Institutional Screener

on:
  schedule:
    # Runs automatically at 16:15 IST (10:45 UTC) on the 1st of every month
    - cron: '45 10 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy smartapi-python pyotp websocket-client logzero

      - name: Run 99-Day Screener
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python orvwb_screener.py

      - name: Commit and Push Screener Ranking
        run: |
          git config --global user.name "ORVWB Auto-Screener"
          git config --global user.email "actions@github.com"
          git add ORVWB_Screener_Ranked.csv
          git diff --staged --quiet || git commit -m "Auto-update 99-day screener rankings"
          git push
