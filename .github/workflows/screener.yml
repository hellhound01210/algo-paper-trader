name: ORVWB v6 99-Day Institutional Screener

on:
  schedule:
    # Runs automatically every Saturday at 10:00 AM IST (04:30 UTC)
    - cron: '30 4 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyotp smartapi-python websocket-client logzero

      - name: Execute Two-Stage Institutional Screener
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python orvwb_screener.py

      - name: Commit and Push Ranked Screener CSV
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"
          git add ORVWB_Screener_Ranked.csv
          git diff --staged --quiet || (git commit -m "Auto-update ORVWB v6 99-day institutional screener" && git pull --rebase origin main && git push)
