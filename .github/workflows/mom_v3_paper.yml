name: Mom v3 Daily Paper Trader

on:
  workflow_dispatch:
    inputs:
      capital:
        description: "Initial capital in INR (used only on Day 0 or reset)"
        required: false
        default: "500000"
      reset:
        description: "Reset state and start fresh? (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Run Mom v3 Paper Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python mom_v3_paper_bot.py \
            --capital "${{ github.event.inputs.capital }}" \
            --reset "${{ github.event.inputs.reset }}"

      - name: Commit Updated State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "chore: update Mom v3 paper state"
          git push
